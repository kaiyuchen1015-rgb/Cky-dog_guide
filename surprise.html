  <dialog class="photo-lightbox" id="photo-lightbox" aria-label="Enlarged photo">
    <button class="photo-lightbox-close" type="button" aria-label="Close enlarged photo">×</button>
    <img id="photo-lightbox-image" alt="Enlarged photo of my dog">
  </dialog>
  <script>
    const photoLightbox=document.getElementById('photo-lightbox');
    const photoLightboxImage=document.getElementById('photo-lightbox-image');
    document.querySelectorAll('.surprise-photo').forEach(button=>button.addEventListener('click',()=>{
      photoLightboxImage.src=button.dataset.photo;
      photoLightboxImage.alt=button.querySelector('img').alt;
      photoLightbox.showModal();
    }));
    document.querySelector('.photo-lightbox-close').addEventListener('click',()=>photoLightbox.close());
    photoLightbox.addEventListener('click',event=>{if(event.target===photoLightbox)photoLightbox.close();});
  </script>
